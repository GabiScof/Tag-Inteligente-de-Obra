
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<!-- Arquivo CSS -->
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<main>
<div class="panel">

<h1>Cadastrar Obra</h1>

<form id="workForm" method="POST">

    <!-- ID da obra -->
    <input
        type="hidden"
        id="workId"
        name="workId"
    >

    <!-- Título -->
    <label for="titulo">
        Título da obra *
    </label>

    <input
        type="text"
        id="titulo"
        name="titulo"
        placeholder="Ex.: A Noite Estrelada"
        maxlength="120"
        required
    >

    <!-- Artista -->
    <label for="artista">
        Artista
    </label>

    <input
        type="text"
        id="artista"
        name="artista"
        placeholder="Ex.: Vincent van Gogh"
        maxlength="120"
    >

    <!-- Ano -->
    <label for="ano">
        Ano de criação
    </label>

    <input
        type="text"
        id="ano"
        name="ano"
        placeholder="Ex.: 1889"
        maxlength="30"
    >

    <!-- Imagem -->
    <label for="imagem_url">
        URL da imagem
    </label>

    <input
        type="url"
        id="imagem_url"
        name="imagem_url"
        placeholder="https://exemplo.com/imagem.jpg"
        maxlength="500"
    >

    <!-- Descrição -->
    <label for="descricao">
        Descrição da obra
    </label>

    <textarea
        id="descricao"
        name="descricao"
        placeholder="Descreva a obra, sua história e seu contexto..."
        maxlength="1500"
        rows="5"
    ></textarea>

    <!-- Curiosidades -->
    <label for="curiosidades">
        Curiosidades
    </label>

    <textarea
        id="curiosidades"
        name="curiosidades"
        placeholder="Adicione curiosidades sobre a obra..."
        maxlength="1500"
        rows="4"
    ></textarea>

    <!-- Token administrativo -->
    <label for="token">
        Token administrativo *
    </label>

    <input
        type="password"
        id="token"
        name="token"
        autocomplete="off"
        required
    >

    <!-- Botões -->
    <button type="submit">
        Salvar obra
    </button>

    <button
        type="reset"
        class="secondary"
    >
        Limpar formulário
    </button>

</form>
</div>
</main>

</body>
</html>
