
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<!-- Arquivo CSS -->
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<main>
<div class="panel">

<form class="container mt-3" method="POST">

    <h1>Cadastro de Visitante</h1>

    <div class="mb-3">
        <label for="nome" class="form-label">
            Nome completo
        </label>

        <input
            type="text"
            class="form-control"
            id="nome"
            name="nome"
            required
        >
    </div>

    <div class="mb-3">
        <label for="email" class="form-label">
            E-mail
        </label>

        <input
            type="email"
            class="form-control"
            id="email"
            name="email"
        >
    </div>

    <div class="mb-3">
        <label for="rfid" class="form-label">
            Código RFID
        </label>

        <input
            type="text"
            class="form-control"
            id="rfid"
            name="rfid"
            required
        >
    </div>

    <div class="form-check mb-3">
        <input
            type="checkbox"
            class="form-check-input"
            id="consentimento"
            name="consentimento"
            value="true"
            required
        >

        <label class="form-check-label"
               for="consentimento">
            Concordo com o uso dos meus dados
            durante a visita.
        </label>
    </div>

    <button type="submit" class="btn btn-primary">
        Finalizar cadastro
    </button>

</form>
</div>
</main>

</body>
</html>
