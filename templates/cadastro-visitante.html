
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<!-- Arquivo CSS -->
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<main>
<div class="panel">

<button
    type="button"
    class="btn-visitantes"
    onclick="abrirVisitantes()">
    Ver visitantes cadastrados
</button>


<form class="container mt-3" method="POST">

    <h1>Cadastro de Visitante</h1>

    <div class="mb-3">
        <label for="nome" class="form-label">
            Nome completo
        </label>

        <input
            type="text"
            class="form-control"
            id="nome"
            name="nome"
            required
        >
    </div>

    <div class="mb-3">
        <label for="email" class="form-label">
            E-mail
        </label>

        <input
            type="email"
            class="form-control"
            id="email"
            name="email"
        >
    </div>

    <div class="mb-3">
        <label for="rfid" class="form-label">
            Código RFID
        </label>

        <input
            type="text"
            class="form-control"
            id="rfid"
            name="rfid"
            required
        >
    </div>

    <div class="consentimento">

    <input
        type="checkbox"
        id="consentimento"
        name="consentimento"
        value="true"
        required
    >

    <label for="consentimento">
        Concordo com o uso dos meus dados durante a visita.
    </label>

    </div>

    <button type="submit" class="btn btn-primary">
        Finalizar cadastro
    </button>

</form>

</div>

<div id="modalVisitantes" class="modal">

    <div class="modal-content">

        <span class="fechar" onclick="fecharVisitantes()">
            &times;
        </span>

        <h2>Visitantes cadastrados</h2>

        <iframe
            id="iframeVisitantes"
            src=""
            width="100%"
            height="450px"
            style="border: none;">
        </iframe>

    </div>

</div>

<script>

function abrirVisitantes() {
    document.getElementById("modalVisitantes").style.display = "flex";

    document.getElementById("iframeVisitantes").src = "/visitantes";
}

function fecharVisitantes() {
    document.getElementById("modalVisitantes").style.display = "none";

    document.getElementById("iframeVisitantes").src = "";
}

</script>

</main>

</body>
</html>
