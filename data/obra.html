<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{TITULO}} | Museu Interativo</title>

    <link rel="stylesheet" href="./style.css">

    <style>
        .obra-container {
            max-width: 850px;
            margin: 45px auto;
        }

        .obra-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .obra-etiqueta {
            color: #A17B4B;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .obra-titulo {
            color: #253C31;
            font-size: clamp(30px, 5vw, 46px);
            margin: 12px 0;
        }

        .obra-metadados {
            color: #68746C;
            font-size: 16px;
        }

        .obra-imagem {
            width: 100%;
            height: 400px;     /* Define uma altura fixa padrão para todas as fotos */
            object-fit: cover; /* Corta os excessos mantendo o enquadramento sem distorcer */
            border-radius: 12px;
            background: #F1F0EB;
            margin: 20px auto 35px;
        }

        .obra-secao {
            margin: 30px 0;
        }

        .obra-secao h2 {
            font-size: 21px;
            color: #284A3D;
            margin-bottom: 12px;
        }

        .obra-secao p {
            color: #536158;
            line-height: 1.9;
            white-space: pre-line;
        }

        .curiosidades {
            background: #F1F5F2;
            padding: 25px;
            border-radius: 12px;
        }

        .obra-rodape {
            margin-top: 60px;
            text-align: center;
            color: #8A938C;
            font-size: 13px;
        }

        [hidden] {
            display: none !important;
        }

        @media (max-width: 600px) {
            .obra-container {
                margin: 25px auto;
            }

            .obra-imagem {
                max-height: 380px;
            }
        }
    </style>
</head>

<body>

    <!-- CABEÇALHO -->
    <header>
        <strong>🏛 Museu Interativo</strong>
    </header>

    <main class="obra-container">

        <!-- IDENTIFICAÇÃO -->
        <section class="obra-header">

            <p class="obra-etiqueta">
                Conheça a obra
            </p>

            <h1 class="obra-titulo" id="titulo">
                {{TITULO}}
            </h1>

            <p class="obra-metadados">
                <span id="artista">{{ARTISTA}}</span>
                <span id="ano">{{ANO}}</span>
            </p>

        </section>

        <!-- IMAGEM -->
        <div id="containerImagem" class="obra-secao">
            <img
                id="imagem"
                class="obra-imagem"
                src="{{IMAGEM_URL}}"
                alt="Imagem da obra"
                onerror="this.style.display='none'"
            >
        </div>

        <!-- DESCRIÇÃO -->
        <section class="obra-secao" id="secaoDescricao">

            <h2>Sobre a obra</h2>

            <p id="descricao">{{DESCRICAO}}</p>

        </section>

        <!-- CURIOSIDADES -->
        <section
            class="obra-secao curiosidades"
            id="secaoCuriosidades"
        >

            <h2>Você sabia?</h2>

            <p id="curiosidades">{{CURIOSIDADES}}</p>

        </section>

        <!-- RODAPÉ -->
        <footer class="obra-rodape">
            Museu Interativo · Arte e Tecnologia
        </footer>

    </main>

</body>
</html>
